<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Add a geocoder</title>
<meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">

<!-- Add the Mapbox GL CSS file -->

<link href='https://api.mapbox.com/mapbox-gl-js/v3.1.2/mapbox-gl.css' rel='stylesheet' />
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<link href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css" rel="stylesheet">
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
</head>
<body>
    <div class="header">
        
        <h1>Weather Monitoring Platform</h1>
        <div id="dataset-time"></div>

    </div>
<!-- side Menu bar -->

<button id="menu-btn" class="menu-btn">
    <img src="menu_final.gif" alt="Menu" class="menu-icon">
    <span class="menu-text">Menu</span>
</button>

<div id="sidebar" class="sidebar">
    <button class="sidebar-btn ozone">
        <img src="ozone.png" alt="Ozone Concentration" class="sidebar-img">
        Ozone Concentration
    </button>
    <button class="sidebar-btn so2">
        <img src="so2.png" alt="SO2 Concentration" class="sidebar-img">
        SO2 Concentration
    </button>
    <button class="sidebar-btn pm25">
        <img src="pm2.5.png" alt="PM 2.5 Concentration" class="sidebar-img">
        PM 2.5 Concentration
    </button>
    <button class="sidebar-btn formaldehyde">
        <img src="formaldehyde.png" alt="Formaldehyde" class="sidebar-img">
        Formaldehyde
    </button>
</div>





















<div id="map"></div>
<br>
<button id="fly">Pakistan</button>
<div id="distance" class="distance-container"></div>
<!--For Interactive Sidebar Body-->



<div class="map-overlay top">
    <div class="map-overlay-inner">
        <fieldset class="select-fieldset">
            <label>Select light preset</label>
            <select id="lightPreset" name="lightPreset">
                <!-- Each value matches a light preset -->
                <option value="dawn">Dawn</option>
                <option value="day" selected="">Day</option>
                <option value="dusk">Dusk</option>
                <option value="night">Night</option>
            </select>
        </fieldset>
        <fieldset>
            <label for="showPlaceLabels">Show place labels</label>
            <input type="checkbox" id="showPlaceLabels" checked="">
        </fieldset>
        <fieldset>
            <label for="showPointOfInterestLabels">Show POI labels</label>
            <input type="checkbox" id="showPointOfInterestLabels" checked="">
        </fieldset>
        <fieldset>
            <label for="showRoadLabels">Show road labels</label>
            <input type="checkbox" id="showRoadLabels" checked="">
        </fieldset>
        <fieldset>
            <label for="showTransitLabels">Show transit labels</label>
            <input type="checkbox" id="showTransitLabels" checked="">
        </fieldset>
    </div>
</div>

  <!-- <div class="slidecontainer">
    <p>Custom range slider:</p>
    <input type="range" min="1" max="100" value="50" class="slider" id="myRange">
  </div> -->


<script src="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.js"></script>
<!-- Include jQuery library -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-geocoder/v5.0.0/mapbox-gl-geocoder.min.js"></script>
<script src="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.js"></script>
<script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
<link rel="stylesheet" href="https://api.mapbox.com/mapbox-gl-js/plugins/mapbox-gl-directions/v4.3.1/mapbox-gl-directions.css" type="text/css">
<script src="script.js"></script>
</body>
</html>
